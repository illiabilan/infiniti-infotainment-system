<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 160" width="100%" height="100%">
  <g fill="none" stroke="#000000" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Центральне кільце вентилятора -->
    <circle cx="80" cy="92" r="11"/>

    <!-- Чотири лопаті вентилятора, повернуті під кутом як на фото -->
    <g transform="rotate(-15, 80, 92)">
      <path id="blade" d="M 80 81 C 62 72, 50 52, 65 40 C 80 28, 102 42, 88 83"/>
      <use href="#blade" transform="rotate(90, 80, 92)"/>
      <use href="#blade" transform="rotate(180, 80, 92)"/>
      <use href="#blade" transform="rotate(270, 80, 92)"/>
    </g>

    <!-- Внутрішня дуга швидкості -->
    <path d="M 94 36 A 56 56 0 0 1 150 92"/>
    
    <!-- Зовнішня дуга швидкості -->
    <path d="M 94 20 A 72 72 0 0 1 166 92"/>
  </g>
</svg>