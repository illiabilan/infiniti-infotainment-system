<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <g fill="none" stroke="#000000" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Базова гілка сніжинки -->
    <g id="branch">
      <line x1="80" y1="80" x2="80" y2="20"/>
      <polyline points="63,33 80,48 97,33"/>
    </g>
    
    <!-- Дублювання гілки по колу з кроком 60 градусів -->
    <use href="#branch" transform="rotate(60, 80, 80)"/>
    <use href="#branch" transform="rotate(120, 80, 80)"/>
    <use href="#branch" transform="rotate(180, 80, 80)"/>
    <use href="#branch" transform="rotate(240, 80, 80)"/>
    <use href="#branch" transform="rotate(300, 80, 80)"/>
  </g>
</svg>